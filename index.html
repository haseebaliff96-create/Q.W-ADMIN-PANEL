<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin Panel - Quick Waiter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ========== RESET & VARIABLES ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        :root {
            --bg: #f0edea;
            --card: #ffffff;
            --primary: #1a1a2e;
            --accent: #6c5ce7;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
            --text: #2d3436;
            --text-light: #636e72;
            --border: #dfe6e9;
            --shadow: 0 8px 30px rgba(0,0,0,0.06);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            background: var(--bg);
            padding: 20px;
            min-height: 100vh;
        }
        #app { max-width: 900px; margin: 0 auto; }

        /* ========== HEADER ========== */
        .header {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left h1 { font-size: 24px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .header-left h1 i { color: var(--accent); }
        .header-left .subtitle { font-size: 13px; color: var(--text-light); margin-top: 2px; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 40px;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #2e7d32; animation: pulse 1.5s infinite; }
        .status-badge.offline { background: #ffebee; color: #c62828; }
        .status-badge.offline .dot { background: #c62828; animation: none; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .refresh-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .refresh-btn:hover { opacity: 0.85; transform: scale(0.97); }
        .refresh-btn:active { transform: scale(0.93); }

        /* ========== STATS ========== */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: var(--transition);
            border-bottom: 3px solid transparent;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .number { font-size: 32px; font-weight: 700; color: var(--primary); line-height: 1.2; }
        .stat-card .label { font-size: 13px; color: var(--text-light); margin-top: 4px; }
        .stat-card.total { border-bottom-color: var(--accent); }
        .stat-card.pending { border-bottom-color: var(--warning); }
        .stat-card.delivered { border-bottom-color: var(--success); }
        .stat-card.callme { border-bottom-color: var(--danger); }

        /* ========== FILTERS ========== */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 20px;
            border: 2px solid var(--border);
            border-radius: 40px;
            background: white;
            color: var(--text-light);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }
        .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
        .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* ========== ORDER LIST ========== */
        #orderList {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--accent);
            transition: var(--transition);
            animation: slideIn 0.3s ease;
        }
        .order-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .order-card.water { border-left-color: var(--success); }
        .order-card.callme { border-left-color: var(--danger); background: #fff5f5; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .order-card .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
        }
        .order-card .order-info { flex: 1; }
        .order-card .order-type {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .order-card .order-meta {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
        }
        .order-card .order-meta span {
            background: var(--bg);
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .order-card .order-meta .call-badge { background: var(--danger); color: white; }
        .order-card .order-meta .user-badge { background: var(--accent); color: white; }
        .order-card .order-meta .new-badge {
            background: var(--success);
            color: white;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .order-card .order-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-badge-sm {
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }
        .status-badge-sm.pending { background: #fff3cd; color: #856404; }
        .status-badge-sm.preparing { background: #cce5ff; color: #004085; }
        .status-badge-sm.delivered { background: #d4edda; color: #155724; }

        .order-card .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .order-card .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .order-card .actions select {
            padding: 6px 14px;
            border: 2px solid var(--border);
            border-radius: 40px;
            font-size: 13px;
            background: white;
            cursor: pointer;
            outline: none;
        }
        .order-card .actions select:focus { border-color: var(--accent); }
        .order-card .actions .delete-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 40px;
            background: var(--danger);
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .order-card .actions .delete-btn:hover { opacity: 0.8; transform: scale(0.97); }
        .order-card .time-text { font-size: 12px; color: var(--text-light); }
        .order-card .countdown {
            font-weight: 700;
            font-size: 14px;
            color: var(--accent);
        }
        .order-card .countdown.expired { color: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state i { font-size: 48px; color: var(--border); margin-bottom: 12px; display: block; }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 9999;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.notification {
            background: var(--danger);
            animation: notifPulse 0.5s ease;
        }
        @keyframes notifPulse {
            0% { transform: translateX(-50%) scale(0.8); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* ========== NOTIFICATION BADGE ========== */
        .notif-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--danger);
            display: inline-block;
            animation: pulse 1s infinite;
            margin-left: 4px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {
            body { padding: 12px; }
            .header { flex-direction: column; align-items: stretch; }
            .header-right { justify-content: space-between; }
            .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
            .stat-card .number { font-size: 24px; }
            .order-card .top-row { flex-direction: column; }
            .order-card .order-right { width: 100%; justify-content: space-between; }
            .order-card .bottom-row { flex-direction: column; align-items: stretch; }
            .order-card .actions { justify-content: flex-start; }
        }
        @media (max-width: 400px) {
            .stats { grid-template-columns: 1fr; }
            .filter-btn { font-size: 12px; padding: 6px 14px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <h1><i class="fas fa-crown"></i> Admin Panel <span id="notifBadge" style="display:none;"><span class="notif-dot"></span></span></h1>
                <div class="subtitle">Real-time order management</div>
            </div>
            <div class="header-right">
                <div class="status-badge" id="statusBadge">
                    <span class="dot"></span>
                    <span id="statusText">Online</span>
                </div>
                <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats">
            <div class="stat-card total"><div class="number" id="totalOrders">0</div><div class="label">📦 Total Orders</div></div>
            <div class="stat-card pending"><div class="number" id="pendingOrders">0</div><div class="label">⏳ Pending</div></div>
            <div class="stat-card delivered"><div class="number" id="deliveredOrders">0</div><div class="label">✅ Delivered</div></div>
            <div class="stat-card callme"><div class="number" id="callMeCount">0</div><div class="label">📍 Call Me</div></div>
        </div>

        <!-- FILTERS -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">📋 All</button>
            <button class="filter-btn" data-filter="tea">🍵 Tea</button>
            <button class="filter-btn" data-filter="water">💧 Water</button>
            <button class="filter-btn" data-filter="callme">📍 Call Me</button>
            <button class="filter-btn" data-filter="pending">⏳ Pending</button>
        </div>

        <!-- ORDER LIST -->
        <div id="orderList">
            <div class="empty-state"><i class="fas fa-inbox"></i><p>Loading orders...</p></div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ============================================================
        //  CONFIGURATION
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCbTrHGBpcjro_vDfhXeVNiTKHUN5VHC4I",
            authDomain: "quick-waiter-23d2e.firebaseapp.com",
            databaseURL: "https://quick-waiter-23d2e-default-rtdb.firebaseio.com",
            projectId: "quick-waiter-23d2e",
            storageBucket: "quick-waiter-23d2e.firebasestorage.app",
            messagingSenderId: "370370890142",
            appId: "1:370370890142:web:a281512088b977233a2e8f",
            measurementId: "G-0Y1TN6E9JS"
        };

        // ============================================================
        //  INIT FIREBASE
        // ============================================================
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        //  ENABLE OFFLINE PERSISTENCE
        // ============================================================
        db.enablePersistence({ synchronizeTabs: true })
            .then(() => console.log('📶 Offline persistence enabled'))
            .catch(err => console.warn('⚠️ Offline persistence error:', err));

        // ============================================================
        //  STATE
        // ============================================================
        let allOrders = [];
        let currentFilter = 'all';
        let unsubscribe = null;
        let countdownIntervals = {};
        let previousOrderIds = new Set();
        let isOnline = navigator.onLine;

        // ============================================================
        //  DOM REFS
        // ============================================================
        const orderList = document.getElementById('orderList');
        const totalOrdersEl = document.getElementById('totalOrders');
        const pendingOrdersEl = document.getElementById('pendingOrders');
        const deliveredOrdersEl = document.getElementById('deliveredOrders');
        const callMeCountEl = document.getElementById('callMeCount');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const refreshBtn = document.getElementById('refreshBtn');
        const toastEl = document.getElementById('toast');
        const notifBadge = document.getElementById('notifBadge');

        // ============================================================
        //  TOAST
        // ============================================================
        let toastTimeout = null;
        function showToast(message, isNotification = false) {
            toastEl.textContent = message;
            toastEl.className = 'toast';
            if (isNotification) {
                toastEl.classList.add('notification');
                // Play sound if available
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = 800;
                    osc.type = 'sine';
                    gain.gain.value = 0.1;
                    osc.start();
                    setTimeout(() => {
                        osc.frequency.value = 1000;
                    }, 100);
                    setTimeout(() => {
                        osc.stop();
                        audioCtx.close();
                    }, 300);
                } catch (e) {}
            }
            toastEl.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('show');
            }, isNotification ? 5000 : 3000);
        }

        // ============================================================
        //  STATUS
        // ============================================================
        function setStatus(online) {
            isOnline = online;
            if (online) {
                statusBadge.className = 'status-badge';
                statusText.textContent = 'Online';
            } else {
                statusBadge.className = 'status-badge offline';
                statusText.textContent = 'Offline';
            }
        }

        // ============================================================
        //  ANONYMOUS AUTH
        // ============================================================
        auth.signInAnonymously()
            .then(() => {
                console.log('✅ Admin authenticated');
                setStatus(navigator.onLine);
                loadOrders();
            })
            .catch((error) => {
                console.error('❌ Auth error:', error);
                setStatus(false);
                loadOrders();
            });

        // ============================================================
        //  LOAD ORDERS (REAL-TIME + NOTIFICATIONS)
        // ============================================================
        function loadOrders() {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }

            // Clear countdown intervals
            Object.keys(countdownIntervals).forEach(key => {
                clearInterval(countdownIntervals[key]);
            });
            countdownIntervals = {};

            // Store previous order IDs for notification
            previousOrderIds = new Set(allOrders.map(o => o.id));

            try {
                unsubscribe = db.collection('orders')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot((snapshot) => {
                        const newOrders = [];
                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            if (data.createdAt && data.createdAt.toDate) {
                                data.createdAtDate = data.createdAt.toDate();
                            }
                            newOrders.push({ id: doc.id, ...data });
                        });

                        // Check for new orders
                        const currentIds = new Set(newOrders.map(o => o.id));
                        const newOrderIds = new Set([...currentIds].filter(id => !previousOrderIds.has(id)));

                        // Notify for each new order
                        if (newOrderIds.size > 0 && isOnline) {
                            newOrderIds.forEach((orderId) => {
                                const newOrder = newOrders.find(o => o.id === orderId);
                                if (newOrder) {
                                    const emoji = newOrder.orderType === 'tea' ? '🍵' : '💧';
                                    const item = newOrder.item || `${newOrder.quantity} cup(s)`;
                                    showToast(`🆕 New ${newOrder.orderType} order: ${item} from ${newOrder.office || 'Unknown'}`, true);
                                    // Flash notification badge
                                    notifBadge.style.display = 'inline';
                                    setTimeout(() => {
                                        notifBadge.style.display = 'none';
                                    }, 5000);
                                }
                            });
                        }

                        // Update previous order IDs
                        previousOrderIds = currentIds;

                        allOrders = newOrders;
                        updateStats();
                        renderOrders();
                        setStatus(true);
                        console.log(`📋 ${allOrders.length} orders loaded`);
                    }, (error) => {
                        console.error('❌ Snapshot error:', error);
                        setStatus(false);
                        loadFromCache();
                    });
            } catch (e) {
                console.error('❌ Firestore error:', e);
                setStatus(false);
                loadFromCache();
            }
        }

        // ============================================================
        //  LOAD FROM CACHE (OFFLINE)
        // ============================================================
        function loadFromCache() {
            db.collection('orders')
                .orderBy('createdAt', 'desc')
                .get({ source: 'cache' })
                .then((snapshot) => {
                    allOrders = [];
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        if (data.createdAt && data.createdAt.toDate) {
                            data.createdAtDate = data.createdAt.toDate();
                        }
                        allOrders.push({ id: doc.id, ...data });
                    });
                    updateStats();
                    renderOrders();
                    setStatus(false);
                    showToast('📡 Offline mode — showing cached orders');
                })
                .catch((error) => {
                    console.error('❌ Cache error:', error);
                    orderList.innerHTML = `<div class="empty-state"><i class="fas fa-wifi-slash"></i><p>No internet connection. Please check your network.</p></div>`;
                    setStatus(false);
                });
        }

        // ============================================================
        //  UPDATE STATS
        // ============================================================
        function updateStats() {
            const total = allOrders.length;
            const pending = allOrders.filter(o => o.status === 'pending').length;
            const delivered = allOrders.filter(o => o.status === 'delivered').length;
            const callMe = allOrders.filter(o => o.callMe === true).length;

            totalOrdersEl.textContent = total;
            pendingOrdersEl.textContent = pending;
            deliveredOrdersEl.textContent = delivered;
            callMeCountEl.textContent = callMe;
        }

        // ============================================================
        //  COUNTDOWN TIMER
        // ============================================================
        function startCountdown(orderId, deliveryTimestamp, duration) {
            if (countdownIntervals[orderId]) {
                clearInterval(countdownIntervals[orderId]);
            }

            const updateCountdown = () => {
                const now = new Date();
                let targetTime;

                if (deliveryTimestamp && deliveryTimestamp.toDate) {
                    targetTime = deliveryTimestamp.toDate();
                } else if (deliveryTimestamp) {
                    targetTime = new Date(deliveryTimestamp);
                } else {
                    return;
                }

                const diff = targetTime - now;
                const el = document.getElementById(`countdown-${orderId}`);
                if (!el) return;

                if (diff <= 0) {
                    el.textContent = '⏰ Done!';
                    el.className = 'countdown expired';
                    clearInterval(countdownIntervals[orderId]);
                    return;
                }

                const minutes = Math.floor(diff / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                el.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                el.className = 'countdown';
            };

            updateCountdown();
            countdownIntervals[orderId] = setInterval(updateCountdown, 1000);
        }

        // ============================================================
        //  RENDER ORDERS
        // ============================================================
        function renderOrders() {
            let filtered = allOrders;

            if (currentFilter === 'tea') filtered = filtered.filter(o => o.orderType === 'tea');
            else if (currentFilter === 'water') filtered = filtered.filter(o => o.orderType === 'water');
            else if (currentFilter === 'callme') filtered = filtered.filter(o => o.callMe === true);
            else if (currentFilter === 'pending') filtered = filtered.filter(o => o.status === 'pending');

            if (filtered.length === 0) {
                orderList.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No orders found</p></div>`;
                return;
            }

            let html = '';
            filtered.forEach((order) => {
                const isCallMe = order.callMe ? '<span class="call-badge">📍 Call Me</span>' : '';
                const statusClass = order.status || 'pending';
                const isWater = order.orderType === 'water' ? 'water' : '';
                const isCallMeClass = order.callMe ? 'callme' : '';
                const itemText = order.item || `${order.quantity} ${order.orderType}(s)`;
                const officeText = order.office || order.room || 'Unknown';
                const recipientText = order.recipient || 'Self';
                const emoji = order.orderType === 'tea' ? '🍵' : '💧';
                const userId = order.userId ? order.userId.substring(0, 8) + '...' : 'Guest';
                const userName = order.userName || 'Guest';
                const createdAt = order.createdAtDate ? order.createdAtDate.toLocaleTimeString() : '';
                const countdownId = `countdown-${order.id}`;

                html += `
                    <div class="order-card ${isWater} ${isCallMeClass}" id="card-${order.id}">
                        <div class="top-row">
                            <div class="order-info">
                                <div class="order-type">${emoji} ${itemText}</div>
                                <div class="order-meta">
                                    <span>🏢 ${officeText}</span>
                                    <span>👤 ${recipientText}</span>
                                    ${order.patti ? `<span>☕ P:${order.patti} S:${order.sugar}</span>` : ''}
                                    ${order.waterType ? `<span>${order.waterType === 'glass' ? '🥛 Glass' : '🧴 Bottle'}</span>` : ''}
                                    ${isCallMe}
                                    <span class="user-badge">🆔 ${userName}</span>
                                </div>
                            </div>
                            <div class="order-right">
                                <span class="status-badge-sm ${statusClass}">${statusClass}</span>
                                ${!isOnline ? ' <span style="font-size:10px; color:#94a3b8;">📶 cached</span>' : ''}
                            </div>
                        </div>
                        <div class="bottom-row">
                            <div class="time-text">⏱️ ${order.durationMinutes || 25} min • ${createdAt}</div>
                            <div class="actions">
                                <span class="countdown" id="${countdownId}">--:--</span>
                                <select onchange="updateStatus('${order.id}', this.value)">
                                    <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="preparing" ${order.status === 'preparing' ? 'selected' : ''}>Preparing</option>
                                    <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                                </select>
                                <button class="delete-btn" onclick="deleteOrder('${order.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });

            orderList.innerHTML = html;

            // Start countdowns
            filtered.forEach((order) => {
                if (order.deliveryTimestamp) {
                    startCountdown(order.id, order.deliveryTimestamp, order.durationMinutes);
                }
            });
        }

        // ============================================================
        //  UPDATE STATUS
        // ============================================================
        function updateStatus(orderId, status) {
            if (!navigator.onLine) {
                showToast('⚠️ You are offline. Status will update when online.');
                return;
            }
            db.collection('orders').doc(orderId).update({ status })
                .then(() => showToast(`✅ Status updated to ${status}`))
                .catch((error) => showToast('❌ Error: ' + error.message));
        }

        // ============================================================
        //  DELETE ORDER
        // ============================================================
        function deleteOrder(orderId) {
            if (!navigator.onLine) {
                showToast('⚠️ You are offline. Delete will happen when online.');
                return;
            }
            if (confirm('Are you sure you want to delete this order?')) {
                db.collection('orders').doc(orderId).delete()
                    .then(() => showToast('✅ Order deleted'))
                    .catch((error) => showToast('❌ Error: ' + error.message));
            }
        }

        // ============================================================
        //  FILTERS
        // ============================================================
        document.querySelectorAll('.filter-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderOrders();
            });
        });

        // ============================================================
        //  REFRESH
        // ============================================================
        refreshBtn.addEventListener('click', () => {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
            loadOrders();
            showToast('🔄 Refreshing...');
        });

        // ============================================================
        //  NETWORK STATUS
        // ============================================================
        window.addEventListener('online', () => {
            setStatus(true);
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
            loadOrders();
            showToast('🟢 Online — Syncing...');
        });

        window.addEventListener('offline', () => {
            setStatus(false);
            showToast('🔴 Offline — Showing cached data');
        });

        // ============================================================
        //  NOTIFICATION PERMISSION (Browser)
        // ============================================================
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // ============================================================
        //  INIT
        // ============================================================
        console.log('🔥 Admin Panel Ready (Offline + Notifications)');
        loadOrders();
    </script>
</body>
</html>
